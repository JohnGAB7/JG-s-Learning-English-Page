name: Build generated JG's Learning English site

# GitHub Pages is already configured to publish master /docs.
# This workflow rebuilds that directory from the canonical tools/ sources.
# The built-in GitHub Pages branch publisher deploys the committed output.
on:
  push:
    branches: [master]
    paths:
      - "tools/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [master]
    paths:
      - "tools/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-generated-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build French and English editions
        run: python3 tools/build.py
      - name: Validate generated website
        run: python3 tools/validate_site.py
      - name: Commit generated pages to master
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Generated site is already up to date."
          else
            git commit -m "Build generated website"
            git push origin HEAD:master
          fi
